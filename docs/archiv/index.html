<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Archiv – Nachrichtenübersicht</title><style>:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-alt: #f0f2f5;
  --border: #dfe3e8;
  --text: #14181d;
  --text-muted: #5b6672;
  --text-faint: #8a939e;
  --accent: #a03c2f;
  --accent-soft: #f5e7e4;
  --shadow: 0 1px 2px rgba(16, 22, 28, 0.06), 0 4px 12px rgba(16, 22, 28, 0.04);
  --radius: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b;
    --surface: #1c2026;
    --surface-alt: #232830;
    --border: #303740;
    --text: #e8ebef;
    --text-muted: #a3adb9;
    --text-faint: #78828e;
    --accent: #e8836f;
    --accent-soft: #33231f;
    --shadow: none;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

.wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 20px 72px;
}

/* --- Kopfbereich --- */

header.page {
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 28px;
}

header.page .wrap { padding-top: 34px; padding-bottom: 22px; }

h1 {
  margin: 0;
  font-size: 1.9rem;
  letter-spacing: -0.02em;
}

.dateline {
  margin: 6px 0 0;
  color: var(--text-muted);
  font-size: 0.95rem;
}

.meta {
  margin: 14px 0 0;
  color: var(--text-faint);
  font-size: 0.82rem;
}

nav.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

nav.categories a {
  display: inline-block;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
}

nav.categories a:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* --- Abschnitte --- */

section { margin-bottom: 40px; scroll-margin-top: 16px; }

h2 {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 4px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--text);
  font-size: 1.2rem;
  letter-spacing: -0.01em;
}

h2 .count {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 0.78rem;
  font-weight: 400;
}

.section-note {
  margin: 8px 0 14px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* --- Artikel --- */

ol.stories {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
}

li.story {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

li.story:last-child { border-bottom: none; }

li.story h3 {
  margin: 0;
  font-size: 1.02rem;
  font-weight: 600;
  line-height: 1.4;
}

li.story h3 a {
  color: var(--text);
  text-decoration: none;
}

li.story h3 a:hover {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
}

p.summary {
  margin: 6px 0 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

.byline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 0.78rem;
  color: var(--text-faint);
}

.source {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-alt);
  color: var(--text-muted);
  font-weight: 600;
}

.also {
  color: var(--text-faint);
}

.also a {
  color: var(--text-faint);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.also a:hover { color: var(--accent); }

/* --- Top-Themen --- */

section.top {
  padding: 20px 22px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

section.top h2 {
  border-bottom-color: var(--accent);
  color: var(--accent);
}

section.top li.story { border-bottom-color: var(--border); }

.badge {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

/* --- Fuß --- */

footer.page {
  margin-top: 48px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
  color: var(--text-faint);
  font-size: 0.82rem;
}

footer.page h2 {
  border: none;
  color: var(--text-muted);
  font-size: 0.9rem;
  padding-bottom: 0;
}

ul.status {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
}

ul.status li::before {
  content: "●";
  margin-right: 6px;
  color: #3f9a52;
}

ul.status li.failed::before { color: #c2503f; }

.empty {
  margin: 14px 0;
  padding: 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: 0.9rem;
  text-align: center;
}

/* --- Archiv --- */

ul.archive {
  list-style: none;
  margin: 20px 0 0;
  padding: 0;
}

ul.archive li {
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
}

ul.archive a {
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}

ul.archive a:hover { color: var(--accent); }

ul.archive .weekday {
  margin-left: 8px;
  color: var(--text-faint);
  font-weight: 400;
  font-size: 0.85rem;
}

a.back {
  display: inline-block;
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 0.85rem;
}

@media (max-width: 560px) {
  h1 { font-size: 1.5rem; }
  .wrap { padding: 0 16px 48px; }
}

@media print {
  body { background: #fff; }
  nav.categories, footer.page { display: none; }
  li.story { break-inside: avoid; }
}
