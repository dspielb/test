<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachrichtenüberblick – noch keine Ausgabe</title>
<style>
:root { color-scheme: light dark; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding: 24px; background: #f6f7f9; color: #14181d;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  line-height: 1.55;
}
main { max-width: 460px; }
h1 { font-size: 1.5rem; margin: 0 0 12px; letter-spacing: -0.02em; }
p { color: #5b6672; margin: 0 0 12px; }
code {
  padding: 2px 6px; border-radius: 4px; background: #e6e9ed;
  font-size: 0.9em;
}
@media (prefers-color-scheme: dark) {
  body { background: #14171b; color: #e8ebef; }
  p { color: #a3adb9; }
  code { background: #232830; }
}
</style>
</head>
<body>
<main>
  <h1>Noch keine Ausgabe vorhanden</h1>
  <p>
    Diese Seite wird vom ersten Lauf der Nachrichtenübersicht ersetzt – entweder
    automatisch nach Zeitplan oder von Hand über
    <em>Actions → Tägliche Nachrichtenübersicht → Run workflow</em>.
  </p>
  <p>Lokal erzeugen: <code>python3 -m newsdigest</code></p>
</main>
</body>
</html>
