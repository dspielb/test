# Konfiguration der Nachrichtenübersicht
#
# Jede [[feed]]-Sektion ist eine Quelle. Felder:
#   id       Eindeutiger Schlüssel (Dateiname für Offline-Fixtures, s. --offline-dir)
#   name     Anzeigename in der HTML-Übersicht
#   url      RSS-, Atom- oder RSS-1.0-Feed
#   category Muss einem Schlüssel unter [categories] entsprechen
#   optional Wenn true, wird ein Ausfall dieser Quelle nur leise protokolliert
#            (sinnvoll für Feeds, die häufig zicken)

[settings]
# Nur Artikel berücksichtigen, die nicht älter als so viele Stunden sind.
window_hours = 24
# Maximale Artikel pro Quelle (verhindert, dass ein Vielschreiber alles dominiert).
max_per_source = 12
# Maximale Artikel pro Kategorie in der Ausgabe.
max_per_category = 40
# Zeitzone für alle Anzeigen.
timezone = "Europe/Berlin"
# HTTP-Timeout pro Feed in Sekunden und Anzahl der Wiederholversuche.
timeout_seconds = 20
retries = 2

# Reihenfolge der Kategorien = Reihenfolge auf der Seite.
[categories]
agenturen = "Agenturen"
deutschland = "Deutschland & Welt"
wirtschaft = "Wirtschaft & Finanzen"
tech = "Tech & IT"

# ---------------------------------------------------------------------------
# Agenturen (dpa, Reuters, AFP)
#
# Wichtig: dpa, AFP und Reuters bieten keine frei zugänglichen Voll-Feeds mehr
# an - der Bezug der Agenturticker ist lizenzpflichtig. Reuters hat seine
# öffentlichen RSS-Feeds 2020 abgeschaltet, dpa und AFP hatten nie welche.
#
# Umgehung hier: Google News liefert RSS für Suchanfragen, inklusive des
# Operators `source:`. Damit bekommt man die Meldungen, die diese Agenturen
# über Partnermedien veröffentlichen - kein vollständiger Ticker, aber die
# relevanten Themen des Tages. Zusätzlich laufen mit ZEIT Online und n-tv zwei
# Quellen mit, die sehr viel unveränderte dpa-Meldungen übernehmen.
# ---------------------------------------------------------------------------

[[feed]]
id = "dpa"
name = "dpa"
url = "https://news.google.com/rss/search?q=when:1d+source:dpa&hl=de&gl=DE&ceid=DE:de"
category = "agenturen"
optional = true

[[feed]]
id = "reuters-de"
name = "Reuters (DE)"
url = "https://news.google.com/rss/search?q=when:1d+source:Reuters&hl=de&gl=DE&ceid=DE:de"
category = "agenturen"
optional = true

[[feed]]
id = "reuters-en"
name = "Reuters (EN)"
url = "https://news.google.com/rss/search?q=when:1d+source:Reuters&hl=en-US&gl=US&ceid=US:en"
category = "agenturen"
optional = true

[[feed]]
id = "afp"
name = "AFP"
url = "https://news.google.com/rss/search?q=when:1d+source:AFP&hl=de&gl=DE&ceid=DE:de"
category = "agenturen"
optional = true

