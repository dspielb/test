# Konfiguration der täglichen Studienübersicht (python -m studywatch)

[quelle]
name = "Critical Care Reviews – Journal Watch"
url = "https://criticalcarereviews.com/latest-evidence/journal-watch"

[einstellungen]
# Obergrenze neuer Studien pro Lauf. Überzählige erscheinen im nächsten Lauf -
# das begrenzt Laufzeit und API-Kosten, wenn die Quelle einmal viel auf einmal bringt.
max_studien = 20
timeout_sekunden = 30
wiederholungen = 2
zeitzone = "Europe/Berlin"
# Ein Link gilt als Studie, wenn er auf einen dieser Hosts zeigt. Alles andere
# auf der Seite (Navigation, Newsletter, Social Media) wird ignoriert.
# Fehlt ein Verlag, hier ergänzen - dafür ist keine Codeänderung nötig.
verlags_hosts = [
  "doi.org",
  "pubmed.ncbi.nlm.nih.gov",
  "nejm.org",
  "evidence.nejm.org",
  "thelancet.com",
  "jamanetwork.com",
  "bmj.com",
  "atsjournals.org",
  "ahajournals.org",
  "acpjournals.org",
  "link.springer.com",
  "ccforum.biomedcentral.com",
  "biomedcentral.com",
  "sciencedirect.com",
  "onlinelibrary.wiley.com",
  "academic.oup.com",
  "journals.lww.com",
  "journal.chestnet.org",
  "nature.com",
  "science.org",
  "cell.com",
  "frontiersin.org",
  "karger.com",
  "tandfonline.com",
  "sagepub.com",
  "pubs.asahq.org",
  "icm-experimental.springeropen.com",
  "medrxiv.org",
]

[anreicherung]
# Beide Dienste sind frei zugänglich und brauchen keinen Schlüssel.
crossref = true
pubmed = true
# Crossref und NCBI bitten um eine Kontaktadresse; wer sie mitschickt, bekommt
# stabilere Antwortzeiten. Leer lassen ist erlaubt.
kontakt_email = ""
# Optionaler NCBI-Schlüssel aus dieser Umgebungsvariablen (hebt 3 auf 10 Anfragen/s).
ncbi_api_key_env = "NCBI_API_KEY"
parallel = 4

[entwurf]
# Die Übersicht landet als Entwurf im Gmail-Postfach - verschickt wird nichts.
aktiv = true
imap_server = "imap.gmail.com"
imap_port = 993
# Umgebungsvariablen mit Gmail-Adresse und App-Passwort (nicht dem Kontopasswort).
benutzer_env = "GMAIL_BENUTZER"
passwort_env = "GMAIL_APP_PASSWORT"
# Leer = Entwurf an die eigene Adresse.
an = ""
# Erlaubte Platzhalter: {datum} und {anzahl}.
betreff = "Neue Studien – {datum}"
# Leer = der Entwürfe-Ordner wird über das IMAP-Merkmal \Drafts gefunden.
# Das funktioniert unabhängig von der Kontosprache; nur im Notfall fest eintragen.
ordner = ""
# Abstracts machen die Mail lang; die Links führen ohnehin zum Original.
mit_abstract = false
# Ohne neue Studien entsteht kein Entwurf - sonst sammelt sich täglich Leergut.
auch_ohne_studien = false

[zusammenfassung]
aktiv = true
modell = "claude-opus-5"
# low genügt zum Verdichten eines Abstracts und hält die Kosten niedrig.
effort = "low"
max_tokens = 2000
api_key_env = "ANTHROPIC_API_KEY"
parallel = 4
